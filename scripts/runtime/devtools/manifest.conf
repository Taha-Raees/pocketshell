# --- Android SDK: COMMUNITY arm64 host tools (Google ships x86_64 only) -----
# Static aarch64 executables; replaces the x86_64 binaries sdkmanager installs.
# Provenance and known limitations: build-tools/PROVENANCE.aarch64 after install.
AARCH64_TOOLS_URL="https://github.com/lzhiyong/android-sdk-tools/releases/download/35.0.2/android-sdk-tools-static-aarch64.zip"
AARCH64_TOOLS_SHA256=db1cea2c4454d5f9c5a802646b2d1cf560b4ee7badbe23e51ab8e1881bb50fc2
AARCH64_TOOLS_UPSTREAM_VERSION=35.0.2

# --- Android NDK: COMMUNITY aarch64-host build (official = x86_64 host only) -
# The repo pins ndkVersion 28.2.13676358 for CI (x86_64 hosts). On-device
# aarch64 builds set PS_LOCAL_NDK=<NDK_REVISION> after installing this, and
# terminal-emulator/build.gradle.kts honors the override (CI: env unset).
# The official ndk-build script rejects aarch64 hosts — the bootstrap applies
# the standard one-line host-tag patch (documented, guest-local).
NDK_URL="https://github.com/Lzhiyong/termux-ndk/releases/download/android-ndk/android-ndk-r29-aarch64.tar.xz"
NDK_SHA256=02e10e4ddfe8deaeb0bd0cf29d04c981ed5bc8a5d6b560ebb9e7661f472d684b
NDK_REVISION=29.0.14206865

# --- glibc locale support (C.utf8) ------------------------------------------
# Without /usr/lib/locale/C.utf8 the glibc JVM resolves sun.jnu.encoding to
# ASCII and CANNOT write non-ASCII filenames (e.g. Kotlin test class names
# with em-dashes) — compileDebugUnitTestKotlin fails with
# InvalidPathException. Fixed on device 2026-09-12; bootstrap 'locale' step
# reproduces it. Debian trixie libc6 ships no compiled locales; localedef
# (libc-bin) + definitions (locales) generate C.utf8 into the guest.
LOCALE_BIN_URL="https://deb.debian.org/debian/pool/main/g/glibc/libc-bin_2.41-12+deb13u4_arm64.deb"
LOCALE_BIN_SHA256=3aba9182d6989d7c512178defdcb9d02b6906816bc8b2778a82a6c39582c880c
LOCALE_DEFS_URL="https://deb.debian.org/debian/pool/main/g/glibc/locales_2.41-12+deb13u4_all.deb"
LOCALE_DEFS_SHA256=ffc5578d5c2c30ca70d46113908f200a09ab6e5e9eda199463af3285dbbaae8c
