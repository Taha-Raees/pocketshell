# manifest.conf — pinned upstream artifacts for the PocketShell dev workstation
# (guest bootstrap: scripts/runtime/devtools/pocketshell-dev-bootstrap)
#
# Every artifact is pinned by exact URL, version, size and sha256.
# arm64 community artifacts are marked COMMUNITY (not Google-built) and are
# documented in docs/runtime/DEV_WORKSTATION.md with provenance and limits.

# --- JDK: glibc Temurin 21 (runs via the M6 glibc sidecar loader) ------------
# The Alpine musl openjdk21 package is BROKEN in this environment (master
# audit §H) and stays uninstalled. Official Adoptium release artifact.
JDK_VERSION=21.0.12.1+1
JDK_URL="https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12%2B1/OpenJDK21U-jdk_aarch64_linux_hotspot_21.0.12_1.tar.gz"
JDK_MIRROR="https://api.adoptium.net/3/binary/version/21.0.12.1%2B1/jdk/aarch64/linux/hotspot/normal/eclipse"
JDK_SHA256=23e37e026f12f3e706f18938ff611db3032d075b09d0879a25d06718c773e223
JDK_SIZE=205641175
JDK_DIR=temurin-21.0.12.1+1
JDK_LINK=temurin-21

